<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Edova hra</title>
<style>
  html, body { margin: 0; height: 100%; background: #05030f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; box-shadow: 0 0 60px #3a2a8a; border-radius: 14px; }
</style>
</head>
<body>
<canvas id="hra" width="800" height="600"></canvas>
<script>
// =====================================================================
//  Edova hra - vesmírná střílečka pro malé piloty
//  Ovládání: šipky = létání, MEZERNÍK = střelba, P/Esc = pauza, M = hudba
//  Všechny rychlosti jsou "pixely za snímek při 60 FPS" a násobí se `k`,
//  takže hra běží stejně rychle na 60Hz i 120Hz monitoru.
// =====================================================================
const canvas = document.getElementById('hra');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---- Nastavení obtížnosti ----
const RYCHLOST_HRACE = 4.2;
const RYCHLOST_STREL = 9;
const RYCHLOST_NEPRATEL = 0.75;
const RYCHLOST_STREL_NEPRATEL = 2;
const ZABIT_NA_BOSSE = 15;

function prizpusobOkno() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.97;
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', prizpusobOkno);
prizpusobOkno();

const nahoda = (a, b) => a + Math.random() * (b - a);
const vzdal = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
let k = 1;      // časový krok (1 = jeden snímek při 60 FPS)
let cas = 0;    // čas v sekundách, pro animace

// ===================== Ovládání =====================
const klavesy = {};
const jmenoKlavesy = e => (e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar') ? ' ' : e.key;
window.addEventListener('keydown', e => {
  const kl = jmenoKlavesy(e);
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(kl)) e.preventDefault();
  zvuk.odemkni();
  if (!klavesy[kl]) stisknuto(kl);
  klavesy[kl] = true;
});
window.addEventListener('keyup', e => { klavesy[jmenoKlavesy(e)] = false; });
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  window.focus();
  zvuk.odemkni();
  if (stav !== 'hra') stisknuto(' ');
});
const maFokus = () => document.hasFocus();
function ztrataOkna() {
  for (const kl in klavesy) klavesy[kl] = false;
  if (stav === 'hra') { stav = 'pauza'; zvuk.zastavHudbu(); }
}
window.addEventListener('blur', ztrataOkna);
document.addEventListener('visibilitychange', () => { if (document.hidden) ztrataOkna(); });

// ===================== Zvuky a hudba =====================
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const AKORDY = [
  { bas: 45, arp: [69, 72, 76] }, // Am
  { bas: 41, arp: [65, 69, 72] }, // F
  { bas: 48, arp: [67, 72, 76] }, // C
  { bas: 43, arp: [67, 71, 74] }, // G
];

const zvuk = {
  ac: null, hudbaZap: true, hudbaHraje: false, krok: 0, dalsiNota: 0, casovac: null,
  odemkni() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const ac = this.ac = new (window.AudioContext || window.webkitAudioContext)();
    const komp = ac.createDynamicsCompressor();
    komp.connect(ac.destination);
    this.master = ac.createGain(); this.master.gain.value = 0.8; this.master.connect(komp);
    this.sfx = ac.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
    this.hudba = ac.createGain(); this.hudba.gain.value = 0.2; this.hudba.connect(this.master);
    // ozvěna - zvuky pak znějí "vesmírně"
    this.ozvena = ac.createDelay(); this.ozvena.delayTime.value = 0.17;
    const zpetna = ac.createGain(); zpetna.gain.value = 0.32;
    const mix = ac.createGain(); mix.gain.value = 0.35;
    this.ozvena.connect(zpetna); zpetna.connect(this.ozvena);
    this.ozvena.connect(mix); mix.connect(this.master);
    // šum pro výbuchy
    const delka = ac.sampleRate * 2;
    this.sum = ac.createBuffer(1, delka, ac.sampleRate);
    const d = this.sum.getChannelData(0);
    for (let i = 0; i < delka; i++) d[i] = Math.random() * 2 - 1;
  },
  ton({ typ = 'sine', f, f2, kdy = 0, delka, hl, cil, filtr, ozvena = false }) {
    if (!this.ac) return;
    const t = this.ac.currentTime + Math.max(0, kdy);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = typ;
    o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + delka);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(hl, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + delka);
    let vystup = o;
    if (filtr) {
      const fl = this.ac.createBiquadFilter();
      fl.type = 'lowpass'; fl.frequency.value = filtr;
      o.connect(fl); vystup = fl;
    }
    vystup.connect(g);
    g.connect(cil || this.sfx);
    if (ozvena) g.connect(this.ozvena);
    o.start(t); o.stop(t + delka + 0.05);
  },
  hluk({ kdy = 0, delka, hl, f1, f2, typ = 'lowpass', cil }) {
    if (!this.ac) return;
    const t = this.ac.currentTime + Math.max(0, kdy);
    const s = this.ac.createBufferSource(); s.buffer = this.sum;
    const fl = this.ac.createBiquadFilter(); fl.type = typ;
    fl.frequency.setValueAtTime(f1, t);
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + delka);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(hl, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + delka);
    s.connect(fl); fl.connect(g); g.connect(cil || this.sfx);
    s.start(t, Math.random() * 0.6); s.stop(t + delka + 0.05);
  },

  // --- efekty ---
  strela() {
    this.ton({ typ: 'triangle', f: 1500, f2: 320, delka: 0.12, hl: 0.08, filtr: 4000 });
    this.ton({ typ: 'square', f: 3000, f2: 700, delka: 0.05, hl: 0.015, filtr: 3000 });
  },
  zasah() { this.hluk({ delka: 0.06, hl: 0.12, f1: 2500, typ: 'highpass' }); },
  bum(vel = 1) {
    this.hluk({ delka: 0.3 + vel * 0.2, hl: 0.45, f1: 2600, f2: 60 });
    this.ton({ f: 150, f2: 38, delka: 0.25 + vel * 0.1, hl: 0.45 });
  },
  hvezda() {
    this.ton({ f: 1568, delka: 0.22, hl: 0.1, ozvena: true });
    this.ton({ f: 2093, kdy: 0.07, delka: 0.3, hl: 0.1, ozvena: true });
    this.ton({ f: 4186, kdy: 0.07, delka: 0.12, hl: 0.025 });
  },
  power() {
    [523, 659, 784, 1047, 1319].forEach((f, i) => {
      this.ton({ typ: 'triangle', f, kdy: i * 0.06, delka: 0.25, hl: 0.09, ozvena: true });
      this.ton({ f: f * 2, kdy: i * 0.06, delka: 0.15, hl: 0.025 });
    });
  },
  srdce() {
    [784, 988, 1175, 1568].forEach((f, i) => this.ton({ f, kdy: i * 0.08, delka: 0.3, hl: 0.1, ozvena: true }));
  },
  au() {
    this.ton({ typ: 'sawtooth', f: 320, f2: 70, delka: 0.45, hl: 0.14, filtr: 900 });
    this.hluk({ delka: 0.3, hl: 0.2, f1: 1500, f2: 200 });
  },
  sirena() {
    for (let i = 0; i < 4; i++) {
      this.ton({ typ: 'triangle', f: 700, kdy: i * 0.36, delka: 0.18, hl: 0.08, filtr: 2200 });
      this.ton({ typ: 'triangle', f: 520, kdy: i * 0.36 + 0.18, delka: 0.18, hl: 0.08, filtr: 2200 });
    }
  },
  uroven() {
    [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.ton({ typ: 'triangle', f, kdy: i * 0.11, delka: 0.3, hl: 0.1, ozvena: true }));
  },
  vyhra() {
    [523, 523, 784, 784, 880, 880, 784, 1047, 1319, 1568].forEach((f, i) =>
      this.ton({ typ: 'triangle', f, kdy: i * 0.14, delka: 0.35, hl: 0.1, ozvena: true }));
  },
  konec() {
    [392, 330, 262].forEach((f, i) => this.ton({ typ: 'triangle', f, kdy: i * 0.2, delka: 0.4, hl: 0.1, ozvena: true }));
  },
  pauza() { this.ton({ f: 660, f2: 440, delka: 0.2, hl: 0.08 }); },
  dal() { this.ton({ f: 440, f2: 660, delka: 0.2, hl: 0.08 }); },

  // --- hudba (plánuje noty dopředu, aby hrála přesně) ---
  spustHudbu() {
    if (!this.ac || this.hudbaHraje) return;
    this.hudbaHraje = true;
    this.dalsiNota = this.ac.currentTime + 0.05;
    this.casovac = setInterval(() => this.planuj(), 25);
  },
  zastavHudbu() {
    this.hudbaHraje = false;
    clearInterval(this.casovac);
  },
  planuj() {
    const delkaKroku = 60 / 112 / 2; // osminy při 112 BPM
    while (this.dalsiNota < this.ac.currentTime + 0.12) {
      if (this.hudbaZap) this.nota(this.krok, this.dalsiNota - this.ac.currentTime);
      this.krok = (this.krok + 1) % 64;
      this.dalsiNota += delkaKroku;
    }
  },
  nota(krok, kdy) {
    const a = AKORDY[Math.floor(krok / 8) % 4];
    const h = this.hudba;
    if ([0, 3, 4, 6].includes(krok % 8)) this.ton({ typ: 'triangle', f: midi(a.bas), kdy, delka: 0.22, hl: 0.4, cil: h, filtr: 700 });
    if (krok % 4 === 0) this.ton({ f: 140, f2: 45, kdy, delka: 0.16, hl: 0.5, cil: h });
    if (krok % 2 === 1) this.hluk({ kdy, delka: 0.04, hl: 0.05, f1: 7000, typ: 'highpass', cil: h });
    if (krok % 8 === 4) this.hluk({ kdy, delka: 0.12, hl: 0.12, f1: 1800, f2: 600, typ: 'bandpass', cil: h });
    const vyska = krok >= 32 ? 12 : 0;
    this.ton({ typ: 'square', f: midi(a.arp[[0, 1, 2, 1][krok % 4]] + vyska), kdy, delka: 0.14, hl: 0.045, cil: h, filtr: 1800 });
  },
};

// ===================== Sprity (předkreslené obrázky) =====================
// Kreslí se v poloviční velikosti a zvětšují bez vyhlazení -> pixelový vzhled.
const PIX = 2;
function sprite(w, h, kresli) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(w / PIX); c.height = Math.ceil(h / PIX);
  const g = c.getContext('2d');
  g.scale(1 / PIX, 1 / PIX);
  g.translate(w / 2, h / 2);
  g.lineJoin = 'round';
  kresli(g);
  // bílá verze pro "bliknutí" po zásahu
  const b = document.createElement('canvas');
  b.width = c.width; b.height = c.height;
  const bg = b.getContext('2d');
  bg.drawImage(c, 0, 0);
  bg.globalCompositeOperation = 'source-atop';
  bg.fillStyle = '#ffffff';
  bg.fillRect(0, 0, b.width, b.height);
  return { c, bila: b, w, h };
}

function kresliSprite(s, x, y, { rot = 0, sx = 1, mer = 1, bily = false, alfa = 1 } = {}) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.scale(sx * mer, mer);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = alfa;
  ctx.drawImage(bily ? s.bila : s.c, -s.w / 2, -s.h / 2, s.w, s.h);
  ctx.restore();
}

function kovovy(g, x0, x1, tmava, svetla) {
  const gr = g.createLinearGradient(x0, 0, x1, 0);
  gr.addColorStop(0, tmava);
  gr.addColorStop(0.42, svetla);
  gr.addColorStop(1, tmava);
  return gr;
}

// --- Edova stíhačka ---
const SPR_HRAC = sprite(72, 84, g => {
  g.strokeStyle = '#141824'; g.lineWidth = 2;
  for (const s of [-1, 1]) {
    // křídlo
    const gk = g.createLinearGradient(0, -6, 0, 26);
    gk.addColorStop(0, '#b4c0d4'); gk.addColorStop(1, '#46506a');
    g.fillStyle = gk;
    g.beginPath(); g.moveTo(s * 8, -8); g.lineTo(s * 34, 14); g.lineTo(s * 34, 25); g.lineTo(s * 20, 23); g.lineTo(s * 8, 26); g.closePath();
    g.fill(); g.stroke();
    // červená špička křídla
    g.fillStyle = '#d8343c';
    g.beginPath(); g.moveTo(s * 27, 8); g.lineTo(s * 34, 14); g.lineTo(s * 34, 25); g.lineTo(s * 27, 24); g.closePath();
    g.fill(); g.stroke();
    // modrý pruh
    g.fillStyle = '#2f7fd8';
    g.beginPath(); g.moveTo(s * 12, 4); g.lineTo(s * 22, 12); g.lineTo(s * 22, 16); g.lineTo(s * 12, 10); g.closePath(); g.fill();
    // kanón na křídle
    g.fillStyle = '#262c3a';
    g.fillRect(s * 22 - 2.5, -8, 5, 20); g.strokeRect(s * 22 - 2.5, -8, 5, 20);
    g.fillStyle = '#9fe8ff'; g.fillRect(s * 22 - 1.5, -10, 3, 3);
    // motor
    g.fillStyle = kovovy(g, s * 4, s * 16, '#3a4256', '#9aa6bc');
    g.beginPath(); g.roundRect(s * 10 - 5, 6, 10, 28, 3); g.fill(); g.stroke();
    g.fillStyle = '#5ad8ff'; g.fillRect(s * 10 - 3, 32, 6, 3);
  }
  // trup
  g.fillStyle = kovovy(g, -11, 11, '#56607a', '#f0f4fa');
  g.beginPath();
  g.moveTo(0, -40); g.quadraticCurveTo(10, -22, 9, 8); g.lineTo(6, 30); g.lineTo(-6, 30); g.lineTo(-9, 8); g.quadraticCurveTo(-10, -22, 0, -40);
  g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = '#00000045'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-8, 8); g.lineTo(8, 8); g.moveTo(-7, 19); g.lineTo(7, 19); g.moveTo(0, 10); g.lineTo(0, 28); g.stroke();
  g.fillStyle = '#d8343c';
  g.beginPath(); g.moveTo(0, -40); g.quadraticCurveTo(4, -34, 5, -29); g.lineTo(-5, -29); g.quadraticCurveTo(-4, -34, 0, -40); g.fill();
  // kokpit
  const gc = g.createLinearGradient(0, -24, 0, 4);
  gc.addColorStop(0, '#d0f6ff'); gc.addColorStop(0.5, '#3aa6e8'); gc.addColorStop(1, '#123a7a');
  g.fillStyle = gc; g.strokeStyle = '#141824'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(0, -9, 4.5, 12, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#ffffffcc';
  g.beginPath(); g.ellipse(-1.5, -14, 1.5, 4, 0, 0, 7); g.fill();
});

// --- nepřátelský letoun (míří dolů) ---
const SPR_STIHACKA = sprite(54, 54, g => {
  g.strokeStyle = '#1a0a0a'; g.lineWidth = 2;
  for (const s of [-1, 1]) {
    const gr = g.createLinearGradient(0, -20, 0, 12);
    gr.addColorStop(0, '#ff9468'); gr.addColorStop(1, '#7a1a12');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(s * 5, -8); g.lineTo(s * 25, -19); g.lineTo(s * 23, -6); g.lineTo(s * 8, 11); g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = '#ffd23a'; g.fillRect(s * 21 - 2, -16, 4, 4);
    g.fillStyle = '#3a2a2a'; g.fillRect(s * 6 - 3, -23, 6, 9); g.strokeRect(s * 6 - 3, -23, 6, 9);
  }
  g.fillStyle = kovovy(g, -9, 9, '#4a120e', '#f0705a');
  g.beginPath(); g.moveTo(0, 25); g.lineTo(8, 4); g.lineTo(7, -17); g.lineTo(-7, -17); g.lineTo(-8, 4); g.closePath();
  g.fill(); g.stroke();
  const gk = g.createRadialGradient(0, 4, 0, 0, 4, 7);
  gk.addColorStop(0, '#f0ffc0'); gk.addColorStop(1, '#3a9a1a');
  g.fillStyle = gk;
  g.beginPath(); g.ellipse(0, 4, 3.5, 6.5, 0, 0, 7); g.fill(); g.stroke();
});

// --- dron s kanónem ---
const SPR_DRON = sprite(62, 66, g => {
  g.strokeStyle = '#12141c'; g.lineWidth = 2;
  g.fillStyle = '#262a36'; g.fillRect(-4.5, 10, 9, 20); g.strokeRect(-4.5, 10, 9, 20);
  g.fillStyle = '#ff6a2a'; g.fillRect(-3, 27, 6, 3);
  const gr = g.createRadialGradient(-8, -10, 4, 0, 0, 27);
  gr.addColorStop(0, '#dde3ec'); gr.addColorStop(1, '#465066');
  g.fillStyle = gr;
  g.beginPath(); g.arc(0, 0, 25, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#00000035';
  for (let i = 0; i < 8; i++) {
    const u = i / 8 * Math.PI * 2;
    g.beginPath(); g.arc(Math.cos(u) * 19, Math.sin(u) * 19, 3, 0, 7); g.fill();
  }
  g.strokeStyle = '#00000040'; g.beginPath(); g.arc(0, 0, 15, 0, 7); g.stroke();
  g.strokeStyle = '#12141c';
  const gd = g.createRadialGradient(-3, -4, 1, 0, 0, 12);
  gd.addColorStop(0, '#ffe8b0'); gd.addColorStop(0.5, '#ff5a2a'); gd.addColorStop(1, '#5a0808');
  g.fillStyle = gd;
  g.beginPath(); g.arc(0, 0, 11, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#ffffffaa'; g.beginPath(); g.arc(-4, -4, 3, 0, 7); g.fill();
});

// --- asteroidy (3 tvary) ---
const SPR_KAMENY = [0, 1, 2].map(() => sprite(66, 66, g => {
  const gr = g.createRadialGradient(-9, -11, 3, 0, 0, 32);
  gr.addColorStop(0, '#bcae9a'); gr.addColorStop(1, '#3a3028');
  g.fillStyle = gr; g.strokeStyle = '#1c1610'; g.lineWidth = 2;
  g.beginPath();
  for (let i = 0; i < 11; i++) {
    const u = i / 11 * Math.PI * 2, r = 27 * nahoda(0.78, 1);
    g.lineTo(Math.cos(u) * r, Math.sin(u) * r);
  }
  g.closePath(); g.fill(); g.stroke();
  for (let i = 0; i < 5; i++) {
    const x = nahoda(-14, 14), y = nahoda(-14, 14), r = nahoda(3, 7);
    g.fillStyle = '#241c1488'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = '#ffffff22'; g.beginPath(); g.arc(x + 1, y + 1.5, r * 0.7, 0, Math.PI); g.fill();
  }
}));

// --- mateřská loď (boss) ---
const SPR_BOSS = sprite(250, 160, g => {
  g.strokeStyle = '#0e1018'; g.lineWidth = 3;
  for (const s of [-1, 1]) {
    // spojovací křídlo
    g.fillStyle = '#58607a';
    g.beginPath(); g.moveTo(s * 30, -32); g.lineTo(s * 70, -22); g.lineTo(s * 70, 22); g.lineTo(s * 30, 38); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = '#00000040'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(s * 40, -28); g.lineTo(s * 40, 33); g.moveTo(s * 55, -25); g.lineTo(s * 55, 28); g.stroke();
    g.strokeStyle = '#0e1018'; g.lineWidth = 3;
    // gondola s kanónem
    g.fillStyle = kovovy(g, s * 66, s * 106, '#3a4256', '#b4bed0');
    g.beginPath(); g.roundRect(s * 88 - 21, -44, 42, 94, 10); g.fill(); g.stroke();
    g.fillStyle = '#20242e'; g.fillRect(s * 88 - 7, 44, 14, 28); g.strokeRect(s * 88 - 7, 44, 14, 28);
    g.fillStyle = '#ff5a2a'; g.fillRect(s * 88 - 5, 68, 10, 4);
    g.fillStyle = '#d8343c';
    g.beginPath(); g.moveTo(s * 88 - 21, -20); g.lineTo(s * 88 + 21, -20); g.lineTo(s * 88 + 21, -12); g.lineTo(s * 88 - 21, -12); g.fill();
    g.fillStyle = '#ffd23a'; g.beginPath(); g.arc(s * 88, -32, 4, 0, 7); g.fill();
  }
  // hlavní trup
  g.fillStyle = kovovy(g, -52, 52, '#2e3446', '#d0d8e4');
  g.beginPath();
  g.moveTo(-40, -70); g.lineTo(40, -70); g.lineTo(54, -22); g.lineTo(42, 52); g.lineTo(0, 74); g.lineTo(-42, 52); g.lineTo(-54, -22);
  g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = '#00000050'; g.lineWidth = 2;
  g.beginPath();
  g.moveTo(-48, -22); g.lineTo(48, -22); g.moveTo(-42, 32); g.lineTo(42, 32);
  g.moveTo(-20, -70); g.lineTo(-24, -22); g.moveTo(20, -70); g.lineTo(24, -22);
  g.stroke();
  g.fillStyle = '#00000060';
  for (const [x, y] of [[-36, -60], [36, -60], [-44, -10], [44, -10], [-36, 42], [36, 42], [0, -60]]) {
    g.beginPath(); g.arc(x, y, 2.5, 0, 7); g.fill();
  }
  // komora jádra
  g.fillStyle = '#181b24'; g.strokeStyle = '#0e1018'; g.lineWidth = 3;
  g.beginPath(); g.arc(0, 5, 23, 0, 7); g.fill(); g.stroke();
  // přední kanón
  g.fillStyle = '#20242e'; g.fillRect(-8, 54, 16, 24); g.strokeRect(-8, 54, 16, 24);
});

// ===================== Grafické pomůcky =====================
const zareCache = {};
function zare(barva) {
  if (zareCache[barva]) return zareCache[barva];
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, barva);
  gr.addColorStop(0.35, barva + '88');
  gr.addColorStop(1, barva + '00');
  g.fillStyle = gr;
  g.fillRect(0, 0, 64, 64);
  return (zareCache[barva] = c);
}
function kresliZari(x, y, velikost, barva, alfa = 1) {
  ctx.globalAlpha = Math.max(0, Math.min(1, alfa));
  ctx.drawImage(zare(barva), x - velikost / 2, y - velikost / 2, velikost, velikost);
  ctx.globalAlpha = 1;
}
function koule(x, y, r, svetla, tmava) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, svetla);
  g.addColorStop(1, tmava);
  return g;
}
function zaoblenyObdelnik(x, y, w, h, r, vypln) {
  ctx.fillStyle = vypln;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}
function hvezdaTvar(x, y, R, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const u = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(u) * rr, y + Math.sin(u) * rr);
  }
  ctx.closePath(); ctx.fill();
}
function srdceTvar(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.7);
  ctx.bezierCurveTo(x - s * 1.2, y - s * 0.1, x - s * 0.6, y - s * 1, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1, x + s * 1.2, y - s * 0.1, x, y + s * 0.7);
  ctx.fill();
}
function napis(t, x, y, vel, barva = '#fff', zarovnani = 'center') {
  ctx.font = `bold ${vel}px "Arial Black", "Helvetica Neue", sans-serif`;
  ctx.textAlign = zarovnani;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, vel / 6);
  ctx.strokeStyle = '#0e0a24';
  ctx.strokeText(t, x, y);
  ctx.fillStyle = barva;
  ctx.fillText(t, x, y);
}

function kresliPlanetu(p) {

  const pauzaKlavesa = klav === 'p' || klav === 'P' || klav === 'Escape';

// velké číslo úrovně uprostřed obrazovky (místo textu)
function ukazCislo(n) { cisla.push({ n, zivot: 100 }); }

// ===================== Výbuchy a částice =====================
function vybuch(x, y, vel = 1) {
  const sq = Math.sqrt(vel);
  for (let i = 0; i < 8 * vel; i++) {
    const u = nahoda(0, 7), v = nahoda(0.3, 2.2) * sq;
    castice.push({ typ: 'ohen', x: x + nahoda(-6, 6) * sq, y: y + nahoda(-6, 6) * sq, vx: Math.cos(u) * v, vy: Math.sin(u) * v, r: nahoda(7, 13) * sq, zivot: nahoda(18, 34) * (0.8 + vel * 0.15), max: 0 });
  }
  for (let i = 0; i < 5 * vel; i++) {
    const u = nahoda(0, 7), v = nahoda(0.2, 1.2) * sq;
    castice.push({ typ: 'kour', x: x + nahoda(-8, 8) * sq, y: y + nahoda(-8, 8) * sq, vx: Math.cos(u) * v, vy: Math.sin(u) * v, r: nahoda(10, 16) * sq, zivot: nahoda(40, 70), max: 0 });
  }
  for (let i = 0; i < 10 * vel; i++) {
    const u = nahoda(0, 7), v = nahoda(3, 7);
    castice.push({ typ: 'jiskra', x, y, vx: Math.cos(u) * v, vy: Math.sin(u) * v, zivot: nahoda(12, 24), max: 0, barva: '#ffe9a0' });
  }
  for (let i = 0; i < 3 * vel; i++) {
    const u = nahoda(0, 7), v = nahoda(1.5, 4);
    castice.push({ typ: 'troska', x, y, vx: Math.cos(u) * v, vy: Math.sin(u) * v, rot: nahoda(0, 7), rotV: nahoda(-0.3, 0.3), w: nahoda(3, 7), h: nahoda(2, 4), zivot: nahoda(30, 50), max: 0 });
  }
  for (const c of castice) if (!c.max) c.max = c.zivot;
  vlny.push({ x, y, r: 6, zivot: 16, max: 16, sila: vel });
}

function ohnostrojBum(x, y) {
  const barva = ['#ffe66d', '#ff6bd6', '#7CFF6B', '#4fc3f7', '#ff8a3c'][Math.floor(nahoda(0, 5))];
  for (let i = 0; i < 40; i++) {
    const u = i / 40 * Math.PI * 2, v = nahoda(2.5, 4.5);
    castice.push({ typ: 'jiskra', x, y, vx: Math.cos(u) * v, vy: Math.sin(u) * v, zivot: 45, max: 45, barva });
  }
}

function jiskricky(x, y, barva, pocet = 6) {
  for (let i = 0; i < pocet; i++) {
    const u = nahoda(0, 7), v = nahoda(1.5, 4);
    castice.push({ typ: 'jiskra', x, y, vx: Math.cos(u) * v, vy: Math.sin(u) * v, zivot: nahoda(10, 20), max: 20, barva });
  }
}

function posunCastice() {
  for (const c of castice) {
    const tlum = Math.pow(c.typ === 'kour' ? 0.97 : c.typ === 'jiskra' ? 0.94 : 0.92, k);
    c.vx *= tlum; c.vy *= tlum;
    c.x += c.vx * k; c.y += (c.vy + 0.35) * k; // 0.35 = pomalý posun s vesmírem
    if (c.rot !== undefined) c.rot += c.rotV * k;
    c.zivot -= k;
  }
  castice = castice.filter(c => c.zivot > 0);
  for (const v of vlny) { v.r += (3 + v.sila) * k; v.zivot -= k; }
  vlny = vlny.filter(v => v.zivot > 0);
  for (const c of cisla) c.zivot -= k;
  cisla = cisla.filter(c => c.zivot > 0);
}

function barvaOhne(t) {
  return t > 0.75 ? '#fff6c0' : t > 0.5 ? '#ffb02e' : t > 0.25 ? '#ff5a1a' : '#8a2a10';
}

function kresliCastice() {
  // kouř (normální míchání)
  for (const c of castice) if (c.typ === 'kour') {
    const t = c.zivot / c.max;
    kresliZari(c.x, c.y, c.r * (2 + (1 - t) * 2), '#4a4a5a', t * 0.55);
  }
  // trosky
  for (const c of castice) if (c.typ === 'troska') {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = Math.min(1, c.zivot / 15);
    ctx.fillStyle = '#7a8296';
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.fillStyle = '#ffb02e';
    ctx.fillRect(-c.w / 2, -c.h / 2, 1.5, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // oheň a jiskry (svítí)
  ctx.globalCompositeOperation = 'lighter';
  for (const c of castice) {
    const t = c.zivot / c.max;
    if (c.typ === 'ohen') {
      kresliZari(c.x, c.y, c.r * (2 + (1 - t) * 2.2), barvaOhne(t), Math.min(1, t * 2));
    } else if (c.typ === 'jiskra') {
      ctx.globalAlpha = Math.min(1, t * 1.5);
      ctx.strokeStyle = c.barva; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x - c.vx * 2.5, c.y - c.vy * 2.5); ctx.stroke();
    } else if (c.typ === 'trysk') {
      kresliZari(c.x, c.y, 6 + (1 - t) * 16, t > 0.6 ? '#bff4ff' : '#3a8aff', t * 0.8);
    }
  }
  ctx.globalAlpha = 1;
  for (const v of vlny) {
    ctx.globalAlpha = v.zivot / v.max * 0.6;
    ctx.strokeStyle = '#ffe9c0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(v.x, v.y, v.r, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function kresliNepritele(n) {
  if (n.typ === 'stihacka') {
    const dx = n.amp * Math.cos(n.faze) * 0.04;
    const rot = -Math.atan2(dx, n.vy);
    ctx.globalCompositeOperation = 'lighter';
    kresliZari(n.x + Math.sin(rot) * 23, n.y - Math.cos(rot) * 23, 22 + Math.sin(cas * 20) * 3, '#ff8a3c', 0.8);
    ctx.globalCompositeOperation = 'source-over';
    kresliSprite(SPR_STIHACKA, n.x, n.y, { rot, bily: n.zasah > 0 });
  } else if (n.typ === 'dron') {
    kresliSprite(SPR_DRON, n.x, n.y, { bily: n.zasah > 0 });

    kresliZari(n.x, n.y, 34 + Math.sin(cas * 6) * 6, '#ff5a2a', 0.6);
    ctx.globalCompositeOperation = 'source-over';
  } else {
    kresliSprite(n.spr, n.x, n.y, { rot: n.rot, bily: n.zasah > 0 });

}

function kresliBosse(b) {

// ===================== Hráč =====================
function kresliLod(x, y, { mer = 1, sx = 1, plamen = 1 } = {}) {
  ctx.globalCompositeOperation = 'lighter';
  for (const s of [-1, 1]) {
    const fx = x + s * 10 * mer * sx, fy = y + 37 * mer;
    kresliZari(fx, fy, (26 + Math.sin(cas * 25 + s) * 4) * mer * plamen, '#5ad8ff', 0.9);
    kresliZari(fx, fy + 4 * mer, 12 * mer * plamen, '#ffffff', 0.9);
  }
  ctx.globalCompositeOperation = 'source-over';
  kresliSprite(SPR_HRAC, x, y, { sx, mer });
}

function kresliHrace() {
  const sx = 1 - Math.min(0.28, Math.abs(hrac.vx) / RYCHLOST_HRACE * 0.28);
  kresliLod(hrac.x, hrac.y, { sx });
  if (hrac.nesmrtelny > 0) {
    const a = Math.min(1, hrac.nesmrtelny / 30);
    const gb = ctx.createRadialGradient(hrac.x, hrac.y, 24, hrac.x, hrac.y, 50);
    gb.addColorStop(0, '#5ad8ff00');
    gb.addColorStop(0.8, '#5ad8ff40');
    gb.addColorStop(1, '#bff4ffaa');
    ctx.globalAlpha = a * (0.85 + Math.sin(cas * 4) * 0.15);
    ctx.fillStyle = gb;
    ctx.beginPath(); ctx.arc(hrac.x, hrac.y, 50, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function pustPredmet(x, y) {
  const r = Math.random();
  if (r < 0.35) predmety.push({ druh: 'hvezda', x, y });
  else if (r < 0.44) predmety.push({ druh: 'sila', x, y });
  else if (r < 0.49) predmety.push({ druh: 'srdce', x, y });

const BARVY_PREDMETU = { hvezda: '#ffd84d', sila: '#5ad8ff', srdce: '#ff4d6d' };

function kresliPredmet(p) {
  ctx.globalCompositeOperation = 'lighter';
  kresliZari(p.x, p.y, 64 + Math.sin(cas * 6) * 8, BARVY_PREDMETU[p.druh], 0.7);
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  if (p.druh === 'hvezda') {
    ctx.scale(Math.max(0.15, Math.abs(Math.cos(cas * 3))), 1); // točí se jako mince
    ctx.fillStyle = koule(0, 0, 16, '#fffbe0', '#e0961a');
    ctx.strokeStyle = '#8a5200';
    hvezdaTvar(0, 0, 16, 7); ctx.stroke();
  } else if (p.druh === 'sila') {
    const gr = ctx.createLinearGradient(-14, 0, 14, 0);
    gr.addColorStop(0, '#1a4a8a'); gr.addColorStop(0.45, '#bff4ff'); gr.addColorStop(1, '#1a4a8a');
    ctx.fillStyle = gr; ctx.strokeStyle = '#0a2448';
    ctx.beginPath(); ctx.roundRect(-14, -18, 28, 36, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffe66d'; ctx.strokeStyle = '#8a5200'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(4, -12); ctx.lineTo(-6, 2); ctx.lineTo(0, 2); ctx.lineTo(-4, 12); ctx.lineTo(6, -2); ctx.lineTo(0, -2); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else {
    const s = 1 + Math.sin(cas * 8) * 0.08; // tluče
    ctx.scale(s, s);
    ctx.fillStyle = koule(0, -3, 18, '#ffc2cf', '#c01a3a');
    ctx.strokeStyle = '#6a0a1a';
    srdceTvar(0, 0, 17); ctx.stroke();
    ctx.fillStyle = '#ffffffaa';
    ctx.beginPath(); ctx.ellipse(-7, -5, 4, 2.5, -0.6, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ===================== Aktualizace =====================
function zraneniHrace() {
  if (hrac.nesmrtelny > 0) return;
  hrac.zivoty--;
  hrac.nesmrtelny = 150;
  hrac.sila = Math.max(1, hrac.sila - 1);
  otresy = 12;
  zvuk.au();
  vybuch(hrac.x, hrac.y, 1);
  if (hrac.zivoty <= 0) {
    vybuch(hrac.x, hrac.y, 3);
    stav = 'konec';
    zvuk.zastavHudbu();
    zvuk.konec();
  }
}

function zasahNepritele(n, dmg = 1) {
  n.zivoty -= dmg; n.zasah = 5;
  if (n.zivoty <= 0) {
    n.mrtvy = true;
    skore += n.body; zabito++;
    vybuch(n.x, n.y, n.typ === 'stihacka' ? 1 : 1.5);
    zvuk.bum(1);
    pustPredmet(n.x, n.y);
  } else {
    jiskricky(n.x, n.y + 10, '#ffe9a0', 5);
    zvuk.zasah();
  }
}

function aktualizuj() {
  // pohyb hráče
  let cilX = 0, cilY = 0;
  if (klavesy['ArrowLeft']) cilX -= RYCHLOST_HRACE;
  if (klavesy['ArrowRight']) cilX += RYCHLOST_HRACE;
  if (klavesy['ArrowUp']) cilY -= RYCHLOST_HRACE;
  if (klavesy['ArrowDown']) cilY += RYCHLOST_HRACE;
  const plynulost = 1 - Math.pow(0.78, k);
  hrac.vx += (cilX - hrac.vx) * plynulost;
  hrac.vy += (cilY - hrac.vy) * plynulost;
  hrac.x = Math.max(40, Math.min(W - 40, hrac.x + hrac.vx * k));
  hrac.y = Math.max(50, Math.min(H - 50, hrac.y + hrac.vy * k));
  if (hrac.nesmrtelny > 0) hrac.nesmrtelny -= k;

  // stopa z motorů
  hrac.trysk -= k;
  while (hrac.trysk <= 0) {
    hrac.trysk += 1.5;
    for (const s of [-1, 1]) {
      castice.push({ typ: 'trysk', x: hrac.x + s * 9 + nahoda(-2, 2), y: hrac.y + 40, vx: -hrac.vx * 0.2, vy: nahoda(2, 3.5), zivot: 16, max: 16 });
    }
  }

  // střelba
  hrac.kadence -= k;
  if (klavesy[' '] && hrac.kadence <= 0) {
    hrac.kadence = 10;
    strely.push({ x: hrac.x, y: hrac.y - 40, vx: 0 });
    if (hrac.sila >= 2) { strely.push({ x: hrac.x - 22, y: hrac.y - 12, vx: 0 }); strely.push({ x: hrac.x + 22, y: hrac.y - 12, vx: 0 }); }
    if (hrac.sila >= 3) { strely.push({ x: hrac.x - 22, y: hrac.y - 12, vx: -1.8 }); strely.push({ x: hrac.x + 22, y: hrac.y - 12, vx: 1.8 }); }
    zvuk.strela();
  }
  for (const s of strely) { s.y -= RYCHLOST_STREL * k; s.x += s.vx * k; }
  strely = strely.filter(s => s.y > -30 && !s.pryc);

  // vlny nepřátel
  if (!boss && zabito < ZABIT_NA_BOSSE * uroven) {
    dalsiVlna -= k;
    if (dalsiVlna <= 0) {
      const r = Math.random();
      if (r < 0.5) { pridejFormaci(); dalsiVlna = Math.max(90, 150 - uroven * 12); }
      else if (r < 0.75 || uroven === 1) { pridejKamen(); dalsiVlna = Math.max(45, 75 - uroven * 6); }
      else { pridejDron(); dalsiVlna = Math.max(60, 90 - uroven * 6); }
    }
  } else if (!boss && nepratele.length === 0) {
    pridejBosse();
  }

  for (const n of nepratele) {
    n.y += n.vy * k;
    if (n.typ === 'stihacka') {
      n.faze += 0.04 * k;
      n.x = n.zakladX + Math.sin(n.faze) * n.amp;
    } else if (n.typ === 'dron') {
      n.faze += 0.02 * k;
      n.x = n.zakladX + Math.sin(n.faze) * 60;
      n.strelba -= k;
      if (n.strelba <= 0 && n.y > 0 && n.y < H - 250) {
        n.strelba = nahoda(130, 200) - uroven * 8;
        strelyNepratel.push({ x: n.x, y: n.y + 30, vx: 0, vy: RYCHLOST_STREL_NEPRATEL });
      }
    } else {
      n.x += n.vx * k;
      n.rot += n.rotV * k;
    }
    if (n.zasah > 0) n.zasah -= k;
    for (const s of strely) {
      if (!s.pryc && vzdal(s, n) < n.r + 6) { s.pryc = true; zasahNepritele(n); if (n.mrtvy) break; }
    }
    if (!n.mrtvy && vzdal(n, hrac) < n.r + hrac.r - 4) { zasahNepritele(n, 99); zraneniHrace(); }
    if (n.y > H + 60) n.mrtvy = true;
  }
  nepratele = nepratele.filter(n => !n.mrtvy);

  // boss
  if (varovani > 0) varovani -= k;
  if (boss) {
    boss.faze += 0.012 * k;
    if (boss.y < 165) boss.y += 1.0 * k;
    else boss.x = W / 2 + Math.sin(boss.faze) * 220;
    if (boss.zasah > 0) boss.zasah -= k;
    if (boss.y >= 165) boss.strelba -= k;
    if (boss.strelba <= 0) {
      boss.strelba = Math.max(55, 90 - uroven * 8);
      boss.strana = (boss.strana + 1) % 3;
      if (boss.strana === 2) {
        for (let i = -1; i <= 1; i++) strelyNepratel.push({ x: boss.x, y: boss.y + 78, vx: i * 1.1, vy: RYCHLOST_STREL_NEPRATEL });
      } else {
        const s = boss.strana === 0 ? -1 : 1;
        strelyNepratel.push({ x: boss.x + s * 88, y: boss.y + 72, vx: 0, vy: RYCHLOST_STREL_NEPRATEL });
      }
    }
    for (const s of strely) {
      if (!s.pryc && Math.abs(s.x - boss.x) < 110 && Math.abs(s.y - boss.y) < 60) {
        s.pryc = true; boss.zivoty--; boss.zasah = 4;
        jiskricky(s.x, s.y, '#ffe9a0', 3);
        if (Math.random() < 0.3) zvuk.zasah();
      }
    }
    if (Math.abs(hrac.x - boss.x) < 105 && Math.abs(hrac.y - boss.y) < 70) zraneniHrace();
    if (boss.zivoty <= 0) {
      for (let i = 0; i < 6; i++) vybuch(boss.x + nahoda(-90, 90), boss.y + nahoda(-50, 50), 2.5);
      vybuch(boss.x, boss.y, 4);
      otresy = 25; zablesk = 1;
      skore += 200;
      zvuk.bum(3);
      for (let i = 0; i < 6; i++) predmety.push({ druh: i < 4 ? 'hvezda' : (i === 4 ? 'srdce' : 'sila'), x: boss.x + nahoda(-70, 70), y: boss.y + nahoda(-30, 30) });
      boss = null;
      uroven++;
      strelyNepratel = [];
      if (uroven > 5) {
        stav = 'vyhra';
        zvuk.zastavHudbu();
        zvuk.vyhra();
      } else {
        ukazCislo(uroven);
        setTimeout(() => zvuk.uroven(), 400);
      }
    }
  }

  // nepřátelské střely
  for (const s of strelyNepratel) {
    s.x += s.vx * k; s.y += s.vy * k;
    if (vzdal(s, hrac) < hrac.r) { s.pryc = true; zraneniHrace(); }
  }
  strelyNepratel = strelyNepratel.filter(s => !s.pryc && s.y < H + 20);

  // předměty (s magnetem)
  const tah = 1 - Math.pow(0.92, k);
  for (const p of predmety) {
    p.y += 1.1 * k;
    const d = vzdal(p, hrac);
    if (d < 130) { p.x += (hrac.x - p.x) * tah; p.y += (hrac.y - p.y) * tah; }
    if (d < hrac.r + 18) {
      p.pryc = true;
      if (p.druh === 'hvezda') { skore += 25; zvuk.hvezda(); }
      if (p.druh === 'sila') { hrac.sila = Math.min(3, hrac.sila + 1); zvuk.power(); }
      if (p.druh === 'srdce') { hrac.zivoty = Math.min(5, hrac.zivoty + 1); zvuk.srdce(); }
      jiskricky(p.x, p.y, BARVY_PREDMETU[p.druh], 14);
      vlny.push({ x: p.x, y: p.y, r: 8, zivot: 14, max: 14, sila: 0 });
    }
  }
  predmety = predmety.filter(p => !p.pryc && p.y < H + 30);

  if (otresy > 0) otresy = Math.max(0, otresy - k);
}

// ===================== Kreslení hry =====================
function kresliHru() {
  ctx.save();
  if (otresy > 0) ctx.translate(Math.sin(cas * 60) * otresy * 0.4, Math.cos(cas * 53) * otresy * 0.4);

  for (const p of predmety) kresliPredmet(p);
  for (const n of nepratele) kresliNepritele(n);
  if (boss) kresliBosse(boss);

  // laserové střely
  ctx.globalCompositeOperation = 'lighter';
  for (const s of strely) {
    kresliZari(s.x, s.y + 4, 34, '#5ad8ff', 0.8);
    ctx.strokeStyle = '#bff4ff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x, s.y - 8); ctx.lineTo(s.x - s.vx * 1.5, s.y + 12); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x, s.y - 7); ctx.lineTo(s.x - s.vx * 1.5, s.y + 10); ctx.stroke();
  }
  // plazmové koule nepřátel
  for (const s of strelyNepratel) {
    kresliZari(s.x, s.y, 46 + Math.sin(cas * 12) * 4, '#ff7a1a', 0.9);
    kresliZari(s.x, s.y, 16, '#fff0c0', 1);
  }
  ctx.globalCompositeOperation = 'source-over';

  if (stav === 'hra' || stav === 'pauza') kresliHrace();
  kresliCastice();
  ctx.restore();

  // bílý záblesk při velkém výbuchu
  if (zablesk > 0) {
    ctx.fillStyle = `rgba(255,240,220,${zablesk * 0.6})`;
    ctx.fillRect(0, 0, W, H);
    zablesk = Math.max(0, zablesk - 0.04 * k);
  }
  // varování před bossem: červeně blikající okraj
  if (varovani > 0) {
    const a = (0.5 + Math.sin(cas * 12) * 0.5) * Math.min(1, varovani / 30);
    ctx.strokeStyle = `rgba(255,40,40,${a})`; ctx.lineWidth = 18;
    ctx.strokeRect(9, 9, W - 18, H - 18);
    ctx.globalAlpha = a;
    kresliVykricnik(W / 2, H / 2 - 40);
    ctx.globalAlpha = 1;
  }
  // velké číslo nové úrovně
  for (const c of cisla) {
    const t = c.zivot / 100;
    const mer = t > 0.85 ? 1 + (t - 0.85) * 4 : 1;
    ctx.globalAlpha = Math.min(1, c.zivot / 25);
    napis(String(c.n), W / 2, H / 2 - 30, 110 * mer, '#ffe66d');
    ctx.globalAlpha = 1;
  }
  kresliListu();
}

function kresliVykricnik(x, y) {
  ctx.fillStyle = '#ff3a3a'; ctx.strokeStyle = '#2a0000'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x, y - 55); ctx.lineTo(x + 60, y + 50); ctx.lineTo(x - 60, y + 50); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(x - 6, y - 22, 12, 44, 5); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y + 35, 6.5, 0, 7); ctx.fill();
}

function kresliListu() {
  // srdíčka
  zaoblenyObdelnik(8, 8, 196, 58, 18, '#0b082088');
  for (let i = 0; i < 5; i++) {
    const x = 30 + i * 36, y = 27;
    if (i < hrac.zivoty) {
      ctx.fillStyle = koule(x, y - 3, 16, '#ffc2cf', '#d01f45');
      srdceTvar(x, y, 13);
      ctx.fillStyle = '#ffffffaa';
      ctx.beginPath(); ctx.ellipse(x - 5, y - 4, 3, 2, -0.6, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = '#ffffff22';
      srdceTvar(x, y, 13);
    }
  }
  // síla zbraně
  for (let i = 0; i < 3; i++) {
    zaoblenyObdelnik(20 + i * 58, 46, 50, 9, 4, i < hrac.sila ? '#5ad8ff' : '#ffffff1a');
  }
  // hvězdičky
  zaoblenyObdelnik(W - 158, 8, 150, 40, 20, '#0b082088');
  ctx.fillStyle = koule(W - 132, 26, 14, '#fffbe0', '#f2a71d');
  hvezdaTvar(W - 132, 28, 13, 6);
  napis(String(skore), W - 22, 29, 24, '#ffe66d', 'right');
  // úroveň jako puntíky
  for (let i = 0; i < 5; i++) {
    const x = W / 2 - 60 + i * 30, y = 26;
    const hotovo = i < uroven - 1, ted = i === uroven - 1;
    ctx.fillStyle = hotovo ? '#ffd84d' : ted ? '#ffffff' : '#ffffff22';
    ctx.beginPath(); ctx.arc(x, y, ted ? 8 + Math.sin(cas * 5) * 1.5 : 7, 0, 7); ctx.fill();
  }
}

// ===================== Obrazovky (bez textu - jen obrázky) =====================
function kresliKlavesu(x, y, w, h, stisk = 0) {
  const dy = stisk * 4;
  zaoblenyObdelnik(x - w / 2, y - h / 2 + 5, w, h, 9, '#3a4258');
  const gr = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  gr.addColorStop(0, '#f4f6fb'); gr.addColorStop(1, '#a8b2c6');
  zaoblenyObdelnik(x - w / 2, y - h / 2 + dy, w, h, 9, gr);
  ctx.strokeStyle = '#3a4258'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2 + dy, w, h, 9); ctx.stroke();
  return dy;
}

function trojuhelnik(x, y, vel, uhel, barva) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(uhel);
  ctx.fillStyle = barva;
  ctx.beginPath(); ctx.moveTo(vel, 0); ctx.lineTo(-vel * 0.6, -vel * 0.8); ctx.lineTo(-vel * 0.6, vel * 0.8); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function kresliSipky(cx, cy) {
  const s = 46;
  const klavesy4 = [[0, -1, -Math.PI / 2, 'ArrowUp'], [-1, 0, Math.PI, 'ArrowLeft'], [0, 0, Math.PI / 2, 'ArrowDown'], [1, 0, 0, 'ArrowRight']];
  for (const [dx, dy, u, kl] of klavesy4) {
    const stisk = klavesy[kl] ? 1 : 0;
    const posun = kresliKlavesu(cx + dx * s, cy + dy * s, 40, 40, stisk);
    trojuhelnik(cx + dx * s, cy + dy * s + posun, 10, u, '#2a3248');
  }
}

function kresliMezernik(cx, cy, w, stisk) {
  kresliKlavesu(cx, cy, w, 40, stisk);
}

function kresliIkonuPauzy(cx, cy, vel = 1) {
  zaoblenyObdelnik(cx - 22 * vel, cy - 28 * vel, 16 * vel, 56 * vel, 5 * vel, '#5ad8ff');
  zaoblenyObdelnik(cx + 6 * vel, cy - 28 * vel, 16 * vel, 56 * vel, 5 * vel, '#5ad8ff');
}

function kresliMys(cx, cy) {
  const klik = Math.sin(cas * 5) > 0;
  ctx.fillStyle = '#e8ecf4'; ctx.strokeStyle = '#3a4258'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(cx - 26, cy - 38, 52, 76, 26); ctx.fill(); ctx.stroke();
  ctx.fillStyle = klik ? '#7CFF6B' : '#c8d0de';
  ctx.beginPath(); ctx.moveTo(cx - 1, cy - 38); ctx.lineTo(cx - 1, cy - 6); ctx.lineTo(cx - 26, cy - 6); ctx.lineTo(cx - 26, cy - 12);
  ctx.arcTo(cx - 26, cy - 38, cx, cy - 38, 24); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - 38); ctx.lineTo(cx, cy - 6); ctx.moveTo(cx - 26, cy - 6); ctx.lineTo(cx + 26, cy - 6); ctx.stroke();
  if (klik) { // "kliknutí" čárky
    ctx.strokeStyle = '#7CFF6B'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (const [x1, y1, x2, y2] of [[-40, -46, -50, -56], [-46, -24, -60, -24], [-24, -54, -26, -68]]) {
      ctx.beginPath(); ctx.moveTo(cx + x1, cy + y1); ctx.lineTo(cx + x2, cy + y2); ctx.stroke();
    }
  }
}

// výzva ke startu: buď blikající mezerník s ▶, nebo myš (když hra nemá klávesnici)
function kresliVyzvu(cx, cy) {
  if (!maFokus()) { kresliMys(cx, cy); return; }
  const stisk = Math.sin(cas * 5) > 0.3 ? 1 : 0;
  kresliMezernik(cx - 30, cy, 200, stisk);
  const p = 1 + Math.sin(cas * 5) * 0.12;
  trojuhelnik(cx + 120, cy + 2, 24 * p, 0, '#7CFF6B');
}

function kresliNadpis(t, x, y, vel) {
  ctx.font = `900 ${vel}px "Arial Black", "Helvetica Neue", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.globalCompositeOperation = 'lighter';
  kresliZari(x, y, vel * 7, '#ff8a3c', 0.35);
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineWidth = vel / 5; ctx.strokeStyle = '#0e0a24';
  ctx.strokeText(t, x, y);
  const gr = ctx.createLinearGradient(0, y - vel / 2, 0, y + vel / 2);
  gr.addColorStop(0, '#fff6c0'); gr.addColorStop(0.45, '#ffd84d'); gr.addColorStop(0.55, '#ff9a2a'); gr.addColorStop(1, '#c84a10');
  ctx.fillStyle = gr;
  ctx.fillText(t, x, y);
  ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff88';
  ctx.strokeText(t, x, y - 1);
}

function kresliMenu() {
  kresliNadpis('Edova hra', W / 2, 105, 84);
  kresliLod(W / 2, 255 + Math.sin(cas * 2) * 8, { mer: 1.5 });
  // ovládání jako obrázky
  kresliSipky(190, 440);
  // mezerník + střely nad ním
  kresliMezernik(420, 462, 150, klavesy[' '] ? 1 : 0);
  ctx.globalCompositeOperation = 'lighter';
  for (const dx of [-25, 25]) {
    const y = 432 - ((cas * 70) % 45);
    ctx.globalAlpha = 1 - (432 - y) / 45;
    ctx.strokeStyle = '#bff4ff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(420 + dx, y - 12); ctx.lineTo(420 + dx, y); ctx.stroke();
    ctx.globalAlpha = 1;
    kresliZari(420 + dx, y - 6, 26, '#5ad8ff', 0.7);
  }
  ctx.globalCompositeOperation = 'source-over';
  // P + ikona pauzy
  const dy = kresliKlavesu(620, 462, 44, 40, klavesy['p'] ? 1 : 0);
  napis('P', 620, 463 + dy, 22, '#2a3248');
  ctx.save(); ctx.globalAlpha = 0.9; kresliIkonuPauzy(620, 405, 0.55); ctx.restore();

  kresliVyzvu(W / 2, 545);
}

function kresliPauzu() {
  ctx.fillStyle = '#0b0820aa';
  ctx.fillRect(0, 0, W, H);
  kresliIkonuPauzy(W / 2, H / 2 - 60, 1.6);
  kresliVyzvu(W / 2, H / 2 + 90);
}

function kresliPohar(x, y) {
  const gr = ctx.createLinearGradient(x - 50, 0, x + 50, 0);
  gr.addColorStop(0, '#a86a10'); gr.addColorStop(0.4, '#fff2a8'); gr.addColorStop(1, '#a86a10');
  ctx.fillStyle = gr; ctx.strokeStyle = '#5a3400'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(x - 48, y - 20, 18, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + 48, y - 20, 18, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 48, y - 50); ctx.lineTo(x + 48, y - 50); ctx.quadraticCurveTo(x + 44, y + 15, x, y + 22); ctx.quadraticCurveTo(x - 44, y + 15, x - 48, y - 50);
  ctx.fill(); ctx.stroke();
  ctx.fillRect(x - 8, y + 20, 16, 22); ctx.strokeRect(x - 8, y + 20, 16, 22);
  ctx.beginPath(); ctx.roundRect(x - 34, y + 40, 68, 16, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = koule(x, y - 18, 18, '#fffbe0', '#e0961a');
  hvezdaTvar(x, y - 16, 18, 8);
}

function kresliKonec() {
  ctx.fillStyle = '#0b0820cc';
  ctx.fillRect(0, 0, W, H);
  if (stav === 'vyhra') {
    ohnostroj -= k;
    if (ohnostroj <= 0) { ohnostroj = 14; ohnostrojBum(nahoda(100, W - 100), nahoda(80, 380)); }
    kresliCastice(); // ohňostroj nad ztmavením
    kresliPohar(W / 2, 190 + Math.sin(cas * 2) * 6);
  } else {
    kresliLod(W / 2, 200 + Math.sin(cas * 2) * 6, { mer: 1.3 });
  }
  // počet hvězdiček
  ctx.fillStyle = koule(W / 2 - 70, 340, 26, '#fffbe0', '#f2a71d');
  hvezdaTvar(W / 2 - 70, 342, 30, 13);
  napis(String(skore), W / 2 + 10, 344, 50, '#ffe66d', 'left');
  kresliVyzvu(W / 2, 470);
}

// ===================== Hlavní smyčka =====================
let posledni = performance.now();
function smycka(ted) {
  const dt = Math.max(0, Math.min(ted - posledni, 50));
  posledni = ted;
  k = dt / (1000 / 60);
  cas += dt / 1000;
  requestAnimationFrame(smycka); // i kdyby se něco pokazilo, hra nezamrzne

  if (stav === 'hra' && !maFokus()) ztrataOkna();
  if (stav !== 'pauza') posunPozadi();
  kresliPozadi();
  if (stav === 'menu') {
    kresliMenu();
  } else {
    if (stav === 'hra') aktualizuj();
    if (stav !== 'pauza') posunCastice();
    kresliHru();
    if (stav === 'pauza') kresliPauzu();
    else if (stav !== 'hra') kresliKonec();
  }
}
requestAnimationFrame(smycka);
</script>
